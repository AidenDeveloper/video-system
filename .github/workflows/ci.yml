name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r auth-service/requirements.txt -r file-service/requirements.txt pytest

      - name: Test auth service
        run: cd auth-service && python -m pytest -q

      - name: Test file service
        run: cd file-service && python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test upload web
        run: cd upload-web && npm ci && npm test

      - name: Test stream web
        run: cd stream-web && npm ci && npm test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets and configure environment
        run: |
          bash ./scripts/gen-secrets.sh
          cp .env.example .env

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke test login and videos API
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$(cat secrets/admin_password)\"}" \
            http://localhost:8080/login
          curl -fsS -b jar http://localhost:8080/api/videos
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/videos)" = "302"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose down

  build-scan-push:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - file-service
          - upload-web
          - stream-web
          - gateway

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build multi-arch image and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}