name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r auth-service/requirements.txt -r file-service/requirements.txt pytest
      - run: cd auth-service && python -m pytest -q
      - run: cd file-service && python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd upload-web && npm ci && npm test
      - run: cd stream-web && npm ci && npm test

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate secrets and configure environment
        run: |
          bash ./scripts/gen-secrets.sh
          cp .env.example .env

      - run: docker compose up -d --build --wait --wait-timeout 240

      - run: |
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$(cat secrets/admin_password)\"}" localhost:8080/login
          curl -fsS -b jar localhost:8080/api/videos
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/videos)" = "302"

      - if: failure()
        run: docker compose logs --tail=100

  build-scan-push:
    needs: smoke
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, file-service, upload-web, stream-web, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build multi-arch and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}