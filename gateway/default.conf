resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: re-resolve so restarted containers are found
log_format videolog '$remote_addr "$request" $status $body_bytes_sent rt=$request_time up=$upstream_response_time';
access_log /dev/stdout videolog;
server_tokens off;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_status 429;

server {
  listen 8080;
  client_max_body_size 210m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_connect_timeout 3s;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  error_page 502 503 504 /unavailable;

  location = /unavailable { internal; default_type text/plain; return 503 "Service temporarily unavailable\n"; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = / { return 302 /login; }

  location ~ ^/(login|logout)$ {
    limit_req zone=login burst=10 nodelay;
    set $up http://auth-service:5000; proxy_pass $up;
  }
  location /upload {
    set $up http://upload-web:3000; proxy_pass $up; proxy_request_buffering off;
  }
  location ~ ^/(videos|api/videos|stream/) {
    set $up http://stream-web:3000; proxy_pass $up; proxy_buffering off;
  }
}